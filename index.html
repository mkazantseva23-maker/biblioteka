<title>Библиотека без выхода</title>
<meta name="description" content="Учебная игра: открывай двери ночной библиотеки, занимайся по таймеру и найди выход.">
<meta name="theme-color" content="#0a1029">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M5 21V9a7 7 0 0 1 14 0v12z' fill='%239cc8ff'/%3E%3C/svg%3E">

<style>
/* Layout: one-screen night library — status strip on top, a hall with three glowing arched doors, a reveal card that rises over them, a full-screen timer. Single dark theme by design. */
:root{
  --ink:#0a1029;          /* night behind the shelves */
  --ink-2:#121b40;        /* shelf wood in moonlight */
  --ink-3:#1c2858;        /* raised surfaces */
  --glow:#9cc8ff;         /* light behind the doors */
  --glow-soft:rgba(156,200,255,.18);
  --candle:#e8c47e;       /* candle gold, the one warm accent */
  --fg:#e8ebf7;
  --muted:#93a0c7;
  --dead:#e0808f;         /* тупик */
  --exit:#8fdcb5;         /* выход */
  --line:rgba(156,200,255,.16);
  --f-display:"Forum","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{min-height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
/* shelves of books, faded into the dark */
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;
  background:
    linear-gradient(180deg,rgba(10,16,41,.2) 0%,var(--ink) 78%),
    repeating-linear-gradient(180deg,transparent 0 118px,#0d1536 118px 130px),
    repeating-linear-gradient(90deg,#16224d 0 9px,#1b2a5c 9px 15px,#121c43 15px 26px,#203063 26px 31px,#14204a 31px 44px,#0f1840 44px 48px);
}
#dust{position:fixed;inset:0;z-index:1;pointer-events:none}
main{position:relative;z-index:2;max-width:760px;margin:0 auto;padding-block:20px 40px;min-height:100%;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.door:focus-visible{outline:2px solid var(--candle);outline-offset:3px}
.btn{
  border:1px solid var(--candle);background:linear-gradient(180deg,rgba(232,196,126,.22),rgba(232,196,126,.08));
  color:var(--fg);padding:13px 22px;border-radius:999px;font-weight:600;font-size:15px;transition:background .2s,transform .1s;
}
.btn:hover{background:rgba(232,196,126,.3)}
.btn:active{transform:translateY(1px)}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--glow)}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- start ---------- */
.start{display:flex;flex-direction:column;gap:22px;align-items:flex-start;padding-top:4vh}
.start h1{font-size:clamp(44px,11vw,84px);line-height:.95;color:var(--fg);text-shadow:0 0 30px rgba(156,200,255,.35)}
.start h1 em{font-style:normal;color:var(--glow)}
.lede{color:var(--muted);max-width:52ch;margin:0;font-size:16px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px;max-width:56ch}
.rules li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.rules .n{font-family:var(--f-display);font-size:22px;color:var(--candle);line-height:1.1}
.picker{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:rgba(18,27,64,.7);padding:9px 16px;border-radius:999px;font-weight:600;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--glow);background:var(--glow-soft);color:#fff;box-shadow:0 0 18px rgba(156,200,255,.25)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- status ---------- */
.status{display:grid;gap:8px;background:rgba(10,16,41,.72);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.status .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px}
.status b{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--ink-3);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--glow),var(--candle));border-radius:6px;transition:width .6s}
.mod{color:var(--candle);font-size:13px}

/* ---------- room ---------- */
.room{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.room h2{font-size:clamp(30px,7.5vw,48px);color:#fff;text-shadow:0 0 24px rgba(156,200,255,.4)}
.room p{margin:0;color:var(--muted);font-size:14px}
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,3vw,28px);margin-top:18px;perspective:900px}
.door{
  all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;
}
.arch{
  position:relative;width:100%;max-width:170px;aspect-ratio:3/5;border-radius:999px 999px 10px 10px;
  border:2px solid rgba(156,200,255,.55);
  background:radial-gradient(ellipse at 50% 38%,rgba(190,220,255,.95) 0%,rgba(110,160,240,.75) 22%,rgba(40,70,150,.85) 58%,#101a42 100%);
  box-shadow:0 0 28px rgba(156,200,255,.35),inset 0 0 30px rgba(10,16,41,.6);
  display:grid;place-items:center;overflow:hidden;transition:box-shadow .3s,transform .5s,filter .3s;
}
.arch::before{ /* frame */
  content:"";position:absolute;inset:7px;border-radius:999px 999px 6px 6px;border:1px solid rgba(255,255,255,.35)
}
.arch::after{ /* the leaf that swings open */
  content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#16245a,#24387a 60%,#1a2b66);
  transform-origin:left center;transform:rotateY(0deg) scaleX(0);transition:transform .7s ease;opacity:.0
}
.arch svg{width:42%;height:auto;color:#fff;filter:drop-shadow(0 0 8px rgba(255,255,255,.8));position:relative;z-index:1}
.door:hover .arch{box-shadow:0 0 46px rgba(156,200,255,.6),inset 0 0 30px rgba(10,16,41,.5);transform:translateY(-3px)}
.door .name{font-family:var(--f-display);font-size:clamp(15px,3.8vw,19px);line-height:1.15;color:var(--fg)}
.door.used{cursor:default}
.door.used .arch{filter:grayscale(.8) brightness(.45);box-shadow:none;transform:none}
.door.used .name{color:var(--muted)}
.door .tag{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;min-height:1.4em}
.tag.dead{color:var(--dead)} .tag.rest{color:var(--glow)} .tag.mod{color:var(--candle)}
.door.opening .arch{animation:swing .55s ease forwards}
@keyframes swing{to{box-shadow:0 0 80px rgba(220,235,255,.9);filter:brightness(1.6)}}

/* ---------- reveal ---------- */
.reveal{
  position:fixed;inset:0;z-index:20;display:grid;place-items:end center;background:rgba(5,8,22,.6);backdrop-filter:blur(3px);
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
@media (min-width:640px){.reveal{place-items:center}}
.card{
  width:100%;max-width:440px;background:linear-gradient(180deg,#1a2656,#111a40);border:1px solid var(--line);border-radius:22px;
  padding:26px 22px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);animation:rise .35s ease
}
@keyframes rise{from{transform:translateY(24px);opacity:.4}}
.seal{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor;color:var(--glow)}
.seal svg{width:30px;height:30px}
.card h3{font-size:30px;line-height:1.05}
.card .big{font-family:var(--f-display);font-size:58px;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.card .big small{font-size:22px;color:var(--muted)}
.card p{margin:0;color:var(--muted);max-width:34ch}
.card .from{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card.dead .seal{color:var(--dead)} .card.dead h3{color:var(--dead)}
.card.exit .seal{color:var(--exit)} .card.exit h3{color:var(--exit)}
.card.mod .seal{color:var(--candle)}
.card .row{justify-content:center;margin-top:6px}

/* ---------- timer ---------- */
.timer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding-top:2vh}
.ring{position:relative;width:min(78vw,320px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--ink-3)}
.ring .prog{stroke:var(--glow);stroke-linecap:round;transition:stroke-dashoffset .9s linear;filter:drop-shadow(0 0 6px rgba(156,200,255,.7))}
.timer.rest .ring .prog{stroke:var(--candle);filter:drop-shadow(0 0 6px rgba(232,196,126,.7))}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;gap:4px}
.clock{font-family:var(--f-display);font-size:clamp(56px,17vw,92px);line-height:1;font-variant-numeric:tabular-nums;color:#fff}
.timer .where{color:var(--muted);font-size:14px}
.timer h2{font-size:clamp(26px,6.5vw,38px)}
.done-note{color:var(--exit);font-weight:600}

/* ---------- exit ---------- */
.exitscreen{display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center;padding-top:3vh}
.exitscreen .arch{max-width:130px;background:radial-gradient(ellipse at 50% 40%,#fff 0%,#e8fff2 25%,#8fdcb5 60%,#1e5a4a 100%);border-color:var(--exit);box-shadow:0 0 60px rgba(143,220,181,.6)}
.exitscreen h1{font-size:clamp(40px,10vw,68px);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:520px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px 8px;background:rgba(18,27,64,.6)}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:400;color:#fff;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}

/* ---------- journal ---------- */
details.journal{border-top:1px solid var(--line);padding-top:12px;width:100%}
details.journal summary{cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600;list-style:none}
details.journal summary::before{content:"▸ ";color:var(--candle)}
details.journal[open] summary::before{content:"▾ "}
.log{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;text-align:left}
.log li{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.log .w{color:var(--muted);min-width:0}
.log .r{font-weight:600;white-space:nowrap}
.log .r.dead{color:var(--dead)} .log .r.study{color:var(--glow)} .log .r.rest{color:var(--candle)} .log .r.exit{color:var(--exit)} .log .r.mod{color:var(--candle)}
.foot{margin-top:auto;display:flex;justify-content:center}
.linkbtn{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:6px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:13.5px;color:var(--muted)}

/* ---------- stats ---------- */
.account{display:grid;gap:20px}
.account h1{font-size:clamp(34px,8vw,50px)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(18,27,64,.65)}
.tile b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;color:#fff;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.today{border-color:var(--glow);box-shadow:0 0 22px rgba(156,200,255,.15)}
.panel{border:1px solid var(--line);border-radius:18px;padding:18px;background:rgba(14,21,52,.8);display:grid;gap:12px}
.panel h2{font-size:26px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.small{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

  ['Комната каталогов','Тысячи ящичков с карточками, один приоткрыт.'],
  ['Обсерватория под крышей','Телескоп смотрит на одну-единственную звезду.'],
  ['Подвал старых свитков','Тихо капает вода, свеча почти догорела.']
];

/* ---------- helpers ---------- */
const rnd = (a,b)=>a+Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function weighted(list){ const t=list.reduce((s,x)=>s+x[1],0); let r=Math.random()*t; for(const [v,w] of list){ if((r-=w)<0) return v; } return list[list.length-1][0]; }
function fmt(min){ min=Math.round(min); const h=Math.floor(min/60), m=min%60; if(!h) return m+' мин'; if(!m) return h+' ч'; return h+' ч '+m+' мин'; }
function clock(ms){ ms=Math.max(0,ms); const s=Math.ceil(ms/1000); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60; const p=n=>String(n).padStart(2,'0'); return (h?h+':'+p(m):p(m))+':'+p(ss); }
function plural(n,a,b,c){ const m10=n%10,m100=n%100; if(m10===1&&m100!==11) return a; if(m10>=2&&m10<=4&&(m100<10||m100>=20)) return b; return c; }
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- state ---------- */
let S = null;
let pref = 300;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({S,pref})); }catch(e){} }
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)||'null'); if(d){ S=d.S||null; pref=d.pref||300; } }catch(e){} }

function newGame(max){
  const target = Math.round(rnd(.6,.9)*max/5)*5;
  S = { phase:'room', max, target, studied:0, sinceBreak:0, mod:null, roomNo:0, room:null, usedRooms:[], usedDoors:[],
        reveal:null, timer:null, log:[], lastKind:null, startedAt:Date.now() };
  nextRoom();
}
function nextRoom(){
  let pool = ROOMS.filter(r=>!S.usedRooms.includes(r[0]));
  if(!pool.length){ S.usedRooms=[]; pool=ROOMS; }
  const r = pick(pool); S.usedRooms.push(r[0]);
  let dp = DOORS.filter(d=>!S.usedDoors.includes(d[0]));
  if(dp.length<3){ S.usedDoors=[]; dp=DOORS; }
  const ds = shuffle(dp).slice(0,3); ds.forEach(d=>S.usedDoors.push(d[0]));
  S.roomNo++;
  S.room = { name:r[0], note:r[1], doors: ds.map(d=>({name:d[0], icon:d[1], opened:false, out:null})), studiedHere:false };
  S.reveal=null; S.timer=null; S.phase='room';
}

function studyLen(){
  let m = weighted([[15,3],[20,2],[25,3],[30,3],[45,2],[60,1]]);
  if(S.max<=90) m = Math.min(m,30);
  let note = null;
  if(S.mod==='fast'){ m = Math.max(10, Math.round(m/2/5)*5); note='Песочные часы ускорены: отрезок вдвое короче.'; }
  if(S.mod==='slow'){ m += 10; note='Туман сгустился: к отрезку добавлено 10 минут.'; }
  S.mod = null;
  const left = S.max - S.studied;
  if(m > left) m = Math.max(5, Math.round(left/5)*5 || left);
  return {m, note};
}

function outcomeFor(doorIdx){
  const room = S.room;
  const othersLeft = room.doors.filter((d,i)=>!d.opened && i!==doorIdx).length;
  if(S.studied >= S.max - 0.5) return {k:'exit'};
  if(S.studied >= S.target && Math.random() < .5) return {k:'exit'};
  if(othersLeft===0) return {k:'study', ...studyLen()};
  const opts = [['study',55],['dead',16],['fast',8],['slow',8]];
  if(S.lastKind!=='rest' && S.sinceBreak>=25) opts.push(['rest',13]);
  if(S.mod) opts.splice(opts.findIndex(o=>o[0]==='fast'),1), opts.splice(opts.findIndex(o=>o[0]==='slow'),1);
  const k = weighted(opts);
  if(k==='study') return {k, ...studyLen()};
  if(k==='rest') return {k, m: pick([5,5,10,10,15])};
  return {k};
}

function logIt(door, out, extra){
  const map = {study:'Учёба '+fmt(extra??out.m), dead:'Тупик', rest:'Передышка '+fmt(out.m), fast:'Ускорение', slow:'Замедление', exit:'Выход!'};
  S.log.push({room:S.room.name, door, k:out.k==='fast'||out.k==='slow'?'mod':out.k, text:map[out.k]});
}

/* ---------- actions ---------- */
function openDoor(i){
  const d = S.room.doors[i];
  if(d.opened || S.reveal!==null) return;
  const el = document.querySelectorAll('.door')[i];
  const out = outcomeFor(i);
  d.opened = true; d.out = out; S.reveal = i;
  if(out.k==='fast'||out.k==='slow') S.mod = out.k;
  if(out.k!=='study') logIt(d.name,out);
  S.lastKind = out.k;
  save();
  if(el && !matchMedia('(prefers-reduced-motion:reduce)').matches){ el.classList.add('opening'); setTimeout(render,520); }
  else render();
}
function closeReveal(){ S.reveal=null; save(); render(); }

function startTimer(kind, min){
  const d = S.room.doors[S.reveal];
  S.timer = { kind, min, total:min*60000, endsAt:Date.now()+min*60000, left:null, door:d.name, done:false };
  S.phase='timer'; S.reveal=null; save(); render(); wake(); unlockAudio();
}
function pauseResume(){
  const t=S.timer;
  if(t.left===null){ t.left = Math.max(0,t.endsAt-Date.now()); }
  else { t.endsAt = Date.now()+t.left; t.left=null; wake(); }
  save(); render();
}
function timerLeft(){ const t=S.timer; return t.left!==null? t.left : Math.max(0,t.endsAt-Date.now()); }
function finishTimer(early){
  const t=S.timer;
  const spent = early ? Math.round((t.total - timerLeft())/60000) : t.min;
  if(t.kind==='study'){
    S.studied = Math.min(S.max, S.studied + spent);
    S.sinceBreak += spent;
    S.log.push({room:S.room.name, door:t.door, k:'study', text:'Учёба '+fmt(spent)+(early?' (досрочно)':'')});
    addStudy(spent);
    nextRoom();
  } else {
    S.sinceBreak = 0;
    S.timer=null; S.phase='room';
  }
  release(); document.title='Библиотека без выхода'; save(); render();
}
function leave(){ S.phase='exit'; S.reveal=null; S.endedAt=Date.now(); save(); render(); }

/* ---------- wake lock & sound ---------- */
let lock=null;
async function wake(){ try{ if('wakeLock' in navigator && !lock){ lock=await navigator.wakeLock.request('screen'); lock.addEventListener('release',()=>lock=null); } }catch(e){} }
function release(){ try{ lock&&lock.release(); }catch(e){} lock=null; }
let actx=null;
function unlockAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function chime(){
  try{ if(!actx) return; const t0=actx.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t0+i*.18); g.gain.linearRampToValueAtTime(.18,t0+i*.18+.02); g.gain.exponentialRampToValueAtTime(.001,t0+i*.18+1.4);
      o.connect(g).connect(actx.destination); o.start(t0+i*.18); o.stop(t0+i*.18+1.5); });
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && S && S.phase==='timer' && S.timer.left===null && !S.timer.done) wake(); });

/* ---------- render ---------- */
function statusBar(){
  const pct = Math.min(100, S.studied/S.max*100);
  const mod = S.mod==='fast' ? '<div class="mod">Следующий отрезок учёбы будет вдвое короче</div>' : S.mod==='slow' ? '<div class="mod">К следующему отрезку учёбы добавится 10 минут</div>' : '';
  return `<div class="status">
    <div class="top"><span>Изучено <b>${fmt(S.studied)}</b> из ${fmt(S.max)}</span><span>Зал <b>${S.roomNo}</b></span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${S.max}" aria-valuenow="${S.studied}"><i style="width:${pct}%"></i></div>${mod}
  </div>`;
}
function journal(open){
  if(!S.log.length) return '';
  const rows = S.log.slice().reverse().map(l=>`<li><span class="w">${esc(l.door)} · ${esc(l.room)}</span><span class="r ${l.k}">${esc(l.text)}</span></li>`).join('');
  return `<details class="journal"${open?' open':''}><summary>Журнал пути · ${S.log.length} ${plural(S.log.length,'запись','записи','записей')}</summary><ul class="log">${rows}</ul></details>`;
}

function renderStart(){
  const has = S && S.phase!=='exit';
  const opts=[60,120,180,240,300,360];
  app.innerHTML = `<section class="start">
    <span class="eyebrow">Учебная игра</span>
    <h1>Библиотека<br><em>без выхода</em></h1>
    <p class="lede">Ты заперта в ночной библиотеке. Выход спрятан за одной из дверей, и найти его можно только учась. Выбери, сколько максимум готова заниматься сегодня: за это время выход найдётся обязательно.</p>
    <ol class="rules">
      <li><span class="n">1</span><span>В каждом зале три двери. Открой любую.</span></li>
      <li><span class="n">2</span><span>За дверью может быть отрезок учёбы с таймером, передышка, тупик или чары, которые ускоряют или замедляют следующий отрезок.</span></li>
      <li><span class="n">3</span><span>Тупик значит выбрать другую дверь в этом же зале. После учёбы попадаешь в новый зал.</span></li>
      <li><span class="n">4</span><span>Учись, пока не откроется дверь с выходом.</span></li>
    </ol>
    <div class="picker">
      <span class="eyebrow" id="lbl">Максимум на сегодня</span>
      <div class="chips" role="group" aria-labelledby="lbl">${opts.map(o=>`<button class="chip" id="max-${o}" data-max="${o}" aria-pressed="${o===pref}">${fmt(o)}</button>`).join('')}</div>
    </div>
    <div class="row">
      <button class="btn" id="go">Войти в библиотеку</button>
      ${has?`<button class="btn ghost" id="cont">Продолжить путь · ${fmt(S.studied)}</button>`:''}
      ${statsBtn()}
    </div>
  </section>`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ pref=+b.dataset.max; save(); renderStart(); document.getElementById('max-'+pref).focus(); });
  $('#go').onclick=()=>{ unlockAudio(); newGame(pref); save(); render(); };
  if(has) $('#cont').onclick=()=>{ unlockAudio(); render(); };

/* ---------- stats: minutes per day, in this browser and in Telegram cloud ---------- */
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const CLOUD = TG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9') ? TG.CloudStorage : null;
const SKEY = 'bib-stats';
let STATS = {};
function dayKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function loadStatsLocal(){ try{ STATS = JSON.parse(localStorage.getItem(SKEY)||'{}') || {}; }catch(e){ STATS = {}; } }
function trimStats(){ const keys=Object.keys(STATS).sort(); while(keys.length>400){ delete STATS[keys.shift()]; } }
function saveStats(){
  trimStats();
  const v = JSON.stringify(STATS);
  try{ localStorage.setItem(SKEY, v); }catch(e){}
  if(CLOUD && v.length < 4000){ try{ CLOUD.setItem(SKEY, v, ()=>{}); }catch(e){} }
}
function mergeCloud(done){
  if(!CLOUD) return done && done();
  try{
    CLOUD.getItem(SKEY, (err, v)=>{
      if(!err && v){ try{ const c = JSON.parse(v); for(const k in c){ STATS[k] = Math.max(STATS[k]||0, c[k]||0); } }catch(e){} saveStats(); }
      done && done();
    });
  }catch(e){ done && done(); }
}
function addStudy(min){ if(min<1) return; const k = dayKey(new Date()); STATS[k] = (STATS[k]||0) + Math.round(min); saveStats(); }
function computeStats(){
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay()+6)%7));
  const first = new Date(today.getFullYear(), today.getMonth(), 1);
  let week=0, month=0, total=0;
  for(const k in STATS){ const [y,m,dd] = k.split('-').map(Number), d = new Date(y,m-1,dd), v = STATS[k]||0;
    total += v; if(d>=monday) week += v; if(d>=first) month += v; }
  const days = []; for(let i=13;i>=0;i--){ const d=new Date(today); d.setDate(today.getDate()-i); days.push({ d, m: STATS[dayKey(d)]||0 }); }
  let streak = 0; const c = new Date(today); if(!STATS[dayKey(c)]) c.setDate(c.getDate()-1);
  while(STATS[dayKey(c)]){ streak++; c.setDate(c.getDate()-1); }
  return { today: STATS[dayKey(today)]||0, week, month, total, days, streak };
}
function chartSvg(days){
  const W=560, H=190, pl=8, pr=8, pt=22, pb=30, n=days.length;
  const max = Math.max(60, ...days.map(x=>x.m)), bw=(W-pl-pr)/n, inner=H-pt-pb;
  const wd = ['вс','пн','вт','ср','чт','пт','сб']; let g = '';
  for(const f of [0.5,1]){ const y = pt + inner*(1-f); g += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl}" y="${y-4}" text-anchor="start" font-size="10" fill="var(--muted)">${fmt(max*f)}</text>`; }
  days.forEach((x,i)=>{
    const h = x.m ? Math.max(3, inner*x.m/max) : 0, cx = pl + bw*i + bw/2, y = pt+inner-h, isT = i===n-1;
    if(h) g += `<rect x="${cx-bw*0.32}" y="${y}" width="${bw*0.64}" height="${h}" rx="4" fill="${isT?'var(--candle)':'var(--glow)'}" opacity="${isT?1:.8}"></rect><text x="${cx}" y="${y-5}" text-anchor="middle" font-size="10" fill="var(--fg)">${x.m}</text>`;
    g += `<text x="${cx}" y="${H-14}" text-anchor="middle" font-size="10.5" fill="${isT?'var(--fg)':'var(--muted)'}">${x.d.getDate()}</text><text x="${cx}" y="${H-2}" text-anchor="middle" font-size="9" fill="var(--muted)">${wd[x.d.getDay()]}</text>`;
  });
  g += `<line x1="${pl}" x2="${W-pr}" y1="${pt+inner}" y2="${pt+inner}" stroke="var(--line)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Минуты учёбы за последние 14 дней">${g}</svg>`;
}
let VIEW = 'game';
function renderStats(){
  const st = computeStats();
  app.innerHTML = `<section class="account">
    <div><span class="eyebrow">Моя учёба</span><h1>Статистика</h1></div>
    <div class="tiles">
      <div class="tile today"><b>${fmt(st.today)}</b><span>сегодня</span></div>
      <div class="tile"><b>${fmt(st.week)}</b><span>на этой неделе</span></div>
      <div class="tile"><b>${fmt(st.month)}</b><span>в этом месяце</span></div>
      <div class="tile"><b>${fmt(st.total)}</b><span>за всё время</span></div>
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between"><h2>Последние 14 дней</h2><span class="small">Серия: <b style="color:var(--candle)">${st.streak} ${plural(st.streak,'день','дня','дней')}</b> подряд</span></div>
      <div class="chart">${chartSvg(st.days)}</div>
      <p class="small">Засчитываются пройденные отрезки учёбы, в том числе закрытые досрочно. ${CLOUD?'Статистика хранится в твоём Telegram и видна с любого устройства.':'Статистика хранится в этом браузере. Если открыть игру через Telegram-бота, она будет видна с любого устройства.'}</p>
    </div>

  </section>`;
  $('#st-back').onclick = ()=>{ VIEW='game'; render(); };
}

function bindStatsBtn(){ const b=$('#to-stats'); if(b) b.onclick=()=>{ VIEW='stats'; render(); window.scrollTo(0,0); }; }

let quitAsk=false;

}
function bindReveal(){
  const go=$('#r-go'), ok=$('#r-ok'), rest=$('#r-rest'), ex=$('#r-exit');
  if(go) go.onclick=()=>startTimer('study', S.room.doors[S.reveal].out.m);
  if(rest) rest.onclick=()=>startTimer('rest', S.room.doors[S.reveal].out.m);
  if(ok) ok.onclick=closeReveal;
  if(ex) ex.onclick=leave;
  const first = go||rest||ex||ok; if(first) first.focus();
}

let earlyAsk=false;
function renderTimer(){
  const t=S.timer, rest=t.kind==='rest';
  const C=2*Math.PI*45;
  app.innerHTML = `${statusBar()}
  <section class="timer${rest?' rest':''}">
    <span class="eyebrow">${rest?'Передышка':'Время учёбы'} · ${esc(t.door)}</span>
    <h2>${esc(S.room.name)}</h2>
    <div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="45" fill="none" stroke-width="3"/><circle class="prog" id="prog" cx="50" cy="50" r="45" fill="none" stroke-width="3" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
      <div class="center"><div class="clock" id="clock" role="timer">${clock(timerLeft())}</div><div class="where" id="state">${t.left!==null?'на паузе':fmt(t.min)}</div></div>
    </div>
    <div id="ctrls" class="row" style="justify-content:center"></div>
  </section>`;
  drawCtrls(); tick();
}
function drawCtrls(){
  const t=S.timer, c=$('#ctrls'); if(!c) return;
  if(t.done){
    c.innerHTML = `<div style="display:grid;gap:12px;justify-items:center"><span class="done-note">${t.kind==='rest'?'Передышка окончена':'Отрезок пройден, свеча догорела'}</span><button class="btn" id="t-next">${t.kind==='rest'?'Вернуться к дверям':'В следующий зал'}</button></div>`;
    $('#t-next').onclick=()=>finishTimer(false); $('#t-next').focus(); return;
  }
  if(earlyAsk){
    c.innerHTML = `<div class="confirm">${t.kind==='rest'?'Закончить отдых сейчас?':'Засчитать только прошедшее время и идти дальше?'} <button class="btn ghost" id="e-y">Да</button><button class="btn ghost" id="e-n">Нет</button></div>`;
    $('#e-y').onclick=()=>{earlyAsk=false;finishTimer(true);}; $('#e-n').onclick=()=>{earlyAsk=false;drawCtrls();}; return;
  }
  c.innerHTML = `<button class="btn" id="t-pause">${t.left!==null?'Продолжить':'Пауза'}</button><button class="btn ghost" id="t-early">Закончить раньше</button>`;
  $('#t-pause').onclick=pauseResume; $('#t-early').onclick=()=>{earlyAsk=true;drawCtrls();};
}
function tick(){
  if(!S || S.phase!=='timer' || !S.timer) return;
  const t=S.timer, left=timerLeft();
  const ck=$('#clock'), pr=$('#prog'), st=$('#state');
  if(ck) ck.textContent=clock(left);
  if(pr){ const C=2*Math.PI*45; pr.style.strokeDashoffset = String(C*(1-left/t.total)); }
  if(!t.done && left<=0){ t.done=true; save(); chime(); release(); if(st) st.textContent='готово'; document.title='✓ Готово · Библиотека'; drawCtrls(); return; }
  if(!t.done && t.left===null) document.title=clock(left)+' · Библиотека';
}
setInterval(tick, 1000);

function renderExit(){
  const doorsOpened = S.log.length;
  const mins = Math.round(((S.endedAt||Date.now())-S.startedAt)/60000);
  app.innerHTML = `<section class="exitscreen">
    <span class="arch" aria-hidden="true">${I.door}</span>
    <span class="eyebrow">Ночь закончилась</span>
    <h1>Ты нашла выход</h1>
    <p class="lede" style="text-align:center">Библиотека отпустила тебя. Можно закрывать учебники с чистой совестью.</p>
    <div class="stats">
      <div class="stat"><b>${fmt(S.studied)}</b><span>учёбы</span></div>
      <div class="stat"><b>${S.roomNo}</b><span>${plural(S.roomNo,'зал','зала','залов')}</span></div>
      <div class="stat"><b>${doorsOpened}</b><span>${plural(doorsOpened,'дверь','двери','дверей')}</span></div>
    </div>
    <p class="where" style="color:var(--muted);margin:0;font-size:13.5px">Весь путь занял ${fmt(mins)} вместе с перерывами.</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">Новая ночь в библиотеке</button>${statsBtn()}</div>
    ${journal(true)}
  </section>`;
  $('#again').onclick=()=>{ S=null; save(); render(); };
  bindStatsBtn();
}

function render(){
  if(VIEW==='stats') return renderStats();
  if(!S) return renderStart();
  if(S.phase==='exit') return renderExit();
  if(S.phase==='timer') return renderTimer();
  return renderRoom();
}

/* ---------- boot ---------- */
if(TG){
  try{ TG.ready(); TG.expand(); }catch(e){}
  try{ TG.setHeaderColor('#0a1029'); TG.setBackgroundColor('#0a1029'); }catch(e){}
  try{ if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }catch(e){}
  try{ if(TG.enableClosingConfirmation) TG.enableClosingConfirmation(); }catch(e){}
}
load(); loadStatsLocal();
if(S && S.phase==='exit') S=null;
renderStart();
mergeCloud(()=>{ if(VIEW==='stats') render(); });

/* ---------- dust in the lamplight ---------- */
const cv=$('#dust'), cx=cv.getContext('2d');
let W,H,parts=[];
function size(){ const d=Math.min(2,devicePixelRatio||1); W=cv.width=innerWidth*d; H=cv.height=innerHeight*d; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  parts=Array.from({length:Math.round(innerWidth*innerHeight/14000)},()=>({x:Math.random()*W,y:Math.random()*H,r:rnd(.4,1.6)*d,v:rnd(.05,.25)*d,a:rnd(.15,.6),p:Math.random()*6})); }
size(); addEventListener('resize',size);
const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
function frame(t){
  cx.clearRect(0,0,W,H);
  for(const p of parts){ if(!still){ p.y-=p.v; p.x+=Math.sin(t/2400+p.p)*.15; if(p.y<-5){p.y=H+5;p.x=Math.random()*W;} }
    cx.globalAlpha=p.a*(.6+.4*Math.sin(t/1500+p.p)); cx.fillStyle='#e8c47e'; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill(); }
  if(!still) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
